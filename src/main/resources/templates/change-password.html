<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/change-password.css}">
</head>
<body>

<div class="container">

    <h2>Change Password</h2>

    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/change-password}" th:object="${form}" method="post">

        <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" required>
            <div class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" required maxlength="128">
            <div class="hint">Min 12 characters with uppercase, lowercase, digit, and special character.</div>
            <div class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>

        <div class="form-group">
            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" th:field="*{confirmNewPassword}" required maxlength="128">
            <div class="error" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></div>
        </div>

        <button type="submit">Change Password</button>

    </form>

    <div class="text-center">
        <a th:href="@{/home}">Back to Home</a>
    </div>

</div>

</body>
</html>
