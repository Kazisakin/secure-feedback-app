<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Feedback</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 120px; resize: vertical; }
        .error { color: red; font-size: 0.875em; margin-top: 4px; }
        .success { color: green; padding: 10px; border: 1px solid green; border-radius: 4px; margin-bottom: 16px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 10px; }
    </style>
</head>
<body>

    <div class="nav">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/logout}">Logout</a>
    </div>

    <h2>Submit Feedback</h2>

    <div class="success" th:if="${param.submitted}">
        Your feedback has been submitted successfully!
    </div>

    <form th:action="@{/feedback}" th:object="${feedbackForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Your full name"/>
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="your@email.com"/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" th:field="*{message}" placeholder="Write your feedback here (10–1000 characters)"></textarea>
            <div class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
        </div>

        <button type="submit">Submit Feedback</button>
    </form>

</body>
</html>
