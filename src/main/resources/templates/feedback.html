<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Feedback</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/feedback.css}">
</head>
<body>

<div class="container">

    <h2>Submit Feedback</h2>

    <div class="alert-success" th:if="${param.submitted}">
        Your feedback has been submitted successfully!
    </div>

    <form th:action="@{/feedback}" th:object="${feedbackForm}" method="post">

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" th:field="*{message}" placeholder="Write your feedback here (10-1000 characters)"></textarea>
            <div class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
        </div>

        <button type="submit">Submit Feedback</button>

    </form>

    <div class="text-center">
        <a th:href="@{/home}">Back to Home</a>
    </div>

</div>

</body>
</html>
