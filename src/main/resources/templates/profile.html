<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>

<div class="container">

    <h2>My Profile</h2>

    <div class="alert-success" th:if="${param.updated}">Profile updated successfully.</div>
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="info-block">
        <div class="info-row">
            <span class="info-label">Username</span>
            <span class="info-value" th:text="${username}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Member since</span>
            <span class="info-value" th:text="${#temporals.format(createdAt, 'dd MMM yyyy')}"></span>
        </div>
    </div>

    <h3>Edit Details</h3>

    <form th:action="@{/profile}" th:object="${form}" method="post">

        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" th:field="*{firstName}" maxlength="50">
            <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" th:field="*{lastName}" maxlength="50">
            <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" maxlength="100">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <button type="submit">Save Changes</button>

    </form>

    <div class="text-center">
        <a th:href="@{/change-password}">Change Password</a>
        &nbsp;|&nbsp;
        <a th:href="@{/home}">Back to Home</a>
    </div>

</div>

</body>
</html>
