<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container">

    <h2>Access Denied</h2>

    <p th:if="${status == 403}">You do not have permission to access this page.</p>
    <p th:if="${status == 404}">The page you are looking for does not exist.</p>
    <p th:if="${status != 403 and status != 404}">Something went wrong. Please try again.</p>

    <a class="btn" th:href="@{/home}">Go Home</a>

</div>
</body>
</html>
