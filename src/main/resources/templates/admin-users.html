<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="container">

    <div class="page-header">
        <h2>Manage Users</h2>
        <a class="back-link" th:href="@{/admin}">← Dashboard</a>
    </div>

    <div class="alert-success" th:if="${param.deleted}">User deleted successfully.</div>
    <div class="alert-error" th:if="${param.error}">This action is not allowed.</div>

    <div class="table-meta">
        <span class="row-count" th:text="${#lists.size(users)} + ' users'"></span>
    </div>

    <table th:if="${!#lists.isEmpty(users)}">
        <thead>
        <tr>
            <th>#</th>
            <th>Username</th>
            <th>Email</th>
            <th>Name</th>
            <th>Role</th>
            <th>Joined</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td>
                <span class="badge badge-registered" th:text="${user.username}"></span>
            </td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.firstName + ' ' + user.lastName}"></td>
            <td>
                <span class="badge badge-role-admin" th:if="${user.role == 'ADMIN'}">Admin</span>
                <span class="badge badge-role-user" th:if="${user.role == 'USER'}">User</span>
            </td>
            <td class="time-ago" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"></td>
            <td>
                <button class="btn-table-danger delete-btn"
                        th:attr="data-username=${user.username}, data-action=@{/admin/users/delete/{id}(id=${user.id})}">
                    Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(users)}">No users found.</div>

</div>

<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <p>Delete user <strong id="confirmUsername"></strong>? This cannot be undone.</p>
        <div class="confirm-actions">
            <button class="confirm-cancel" id="confirmCancel">Cancel</button>
            <form id="confirmForm" class="confirm-form" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="confirm-delete">Delete</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/confirm-delete.js}"></script>
<script th:src="@{/js/particles.js}"></script>
</body>
</html>
