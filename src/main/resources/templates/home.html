<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="container">

    <h2>Welcome, <span th:text="${username}"></span></h2>

    <div class="alert-success" th:if="${param.passwordChanged}">
        Password changed successfully.
    </div>

    <hr class="divider">

    <h3>Feedback</h3>
    <a class="btn" th:href="@{/feedback}">Submit Feedback</a>

    <hr class="divider">

    <h3>Profile</h3>
    <a class="btn btn-grey" th:href="@{/change-password}">Change Password</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-grey">Logout</button>
    </form>

</div>

</body>
</html>
